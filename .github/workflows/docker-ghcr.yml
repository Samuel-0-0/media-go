name: Docker GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow and prebuilt binaries
        uses: actions/checkout@v4

      - name: Prepare precompiled multi-architecture build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ghcr

          for required_file in \
            docker/mediago-linux-amd64 \
            docker/mediago-linux-arm64 \
            docker/Dockerfile.template \
            docker/requirements-spider.txt; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Missing required file: $required_file"
              exit 1
            fi
          done

          cp docker/mediago-linux-amd64 build/ghcr/
          cp docker/mediago-linux-arm64 build/ghcr/
          tr -d '\r' < docker/requirements-spider.txt > build/ghcr/requirements-spider.txt

          cat > build/ghcr/docker-healthcheck.py <<'HEALTHCHECK'
          import json
          import http.client
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          state = Path("/tmp/mediago-healthcheck.json")
          try:
              if "--snapshot" in sys.argv:
                  address = os.environ.get("HTTP_ADDR", "")
                  if not address:
                      try:
                          settings = json.loads((Path(os.environ.get("DATA_DIR") or "/data") / "settings.json").read_text())
                          address = settings.get("values", {}).get("HTTP_ADDR", ":8080")
                      except FileNotFoundError:
                          address = ":8080"
                  if address.startswith("["):
                      match = re.fullmatch(r"\[([^\[\]]+)\]:([0-9]+)", address)
                      if not match:
                          raise ValueError()
                      host, port = match.groups()
                      host = "[::1]" if host == "::" else f"[{host}]"
                  else:
                      match = re.fullmatch(r"([A-Za-z0-9_.-]*):([0-9]+)", address)
                      if not match:
                          raise ValueError()
                      host, port = match.groups()
                      host = "127.0.0.1" if host in ("", "0.0.0.0") else host
                  if not 1 <= int(port) <= 65535:
                      raise ValueError()
                  state.write_text(json.dumps({"url": f"http://{host}:{int(port)}/healthz"}))
              else:
                  snapshot = json.loads(state.read_text())
                  with urllib.request.urlopen(snapshot["url"], timeout=3) as response:
                      if response.status != 200 or json.loads(response.read(4096)).get("status") != "ok":
                          raise ValueError()
          except (OSError, ValueError, KeyError, TypeError, AttributeError, urllib.error.URLError, TimeoutError, http.client.HTTPException):
              sys.exit(1)
          HEALTHCHECK

          cat > build/ghcr/docker-entrypoint.sh <<'ENTRYPOINT'
          #!/bin/sh
          set -eu
          /opt/venv/bin/python /app/docker-healthcheck.py --snapshot
          exec /usr/bin/tini -g -- /app/anime-go "$@"
          ENTRYPOINT

          cat > build/ghcr/verify-runtime.py <<'RUNTIME_CHECK'
          import argparse
          import shutil
          import subprocess
          import sys

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--dependencies-only", action="store_true")
              parser.add_argument("--node", default="node")
              parser.add_argument("--version")
              options = parser.parse_args()

              if sys.version_info < (3, 10):
                  raise AssertionError("Python 3.10 or later is required")
              import requests
              from bs4 import BeautifulSoup
              from Crypto.Cipher import AES
              from Crypto.Util.Padding import pad, unpad
              from lxml import html
              from lxml.cssselect import CSSSelector
              from pyquery import PyQuery

              assert PyQuery("<ul><li>MediaGo fixture</li></ul>")("li").text() == "MediaGo fixture"
              key, iv, message = b"0123456789abcdef", b"fedcba9876543210", b"MediaGo AES fixture"
              encrypted = AES.new(key, AES.MODE_CBC, iv).encrypt(pad(message, AES.block_size))
              assert unpad(AES.new(key, AES.MODE_CBC, iv).decrypt(encrypted), AES.block_size) == message
              subprocess.run([options.node, "--version"], capture_output=True, text=True, timeout=30, check=True)
              for tool in ("ffmpeg", "ffprobe", "fpcalc"):
                  if shutil.which(tool) is not None:
                      subprocess.run([tool, "-version"], capture_output=True, timeout=30, check=True)
              print("Docker runtime dependencies verified: OK")

          if __name__ == "__main__":
              main()
          RUNTIME_CHECK

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read_lf(path: str) -> str:
              return Path(path).read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")

          template = read_lf("docker/Dockerfile.template")
          # Ensure default DEBIAN_MIRROR uses http:// before ca-certificates is installed in debian:trixie-slim
          template = template.replace(
              "ARG DEBIAN_MIRROR=https://deb.debian.org",
              "ARG DEBIAN_MIRROR=http://deb.debian.org",
          )
          replacements = {
              "@@PYTHON_REQUIREMENTS@@": read_lf("build/ghcr/requirements-spider.txt").rstrip("\n"),
              "@@HEALTHCHECK@@": read_lf("build/ghcr/docker-healthcheck.py").rstrip("\n"),
              "@@ENTRYPOINT@@": read_lf("build/ghcr/docker-entrypoint.sh").rstrip("\n"),
              "@@RUNTIME_CHECK@@": read_lf("build/ghcr/verify-runtime.py").rstrip("\n"),
          }
          for marker, content in replacements.items():
              template = template.replace(marker, content)

          unresolved = re.findall(r"@@[A-Z_]+@@", template)
          if unresolved:
              raise SystemExit(f"Unresolved Dockerfile.template markers: {unresolved}")

          if not template.lstrip().startswith("# syntax="):
              template = "# syntax=docker/dockerfile:1.7\n" + template

          Path("build/ghcr/Dockerfile").write_text(template, encoding="utf-8")
          print("Rendered build/ghcr/Dockerfile successfully from docker/Dockerfile.template")
          PY

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: build/ghcr
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
