name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main                  # 推送到 main 分支时自动触发（可按需改为 master）
    tags:
      - 'v*.*.*'              # 推送版本 Tag 时自动触发 (例如 v1.0.0)
  pull_request:
    branches:
      - main                  # PR 时仅执行构建校验，不推送到仓库
  workflow_dispatch:          # 允许在 GitHub 网页界面手动点击运行

env:
  REGISTRY: ghcr.io
  # 镜像名称格式：ghcr.io/<用户名或组织名>/<仓库名>（自动转小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # 必须具备 packages 写入权限才能推送到 ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 Buildx 构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry (使用内置 GITHUB_TOKEN，无需手动配 Secret)
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像标签 (main分支对应 latest，tag 对应具体版本)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max